const EXTRA_STEPS={"ops": [["理解运算符号", "加法是合并，减法是求差，乘法是相同数量的重复组合，除法是平均分或求包含多少份。"], ["先看运算层级", "括号优先；乘方优先于乘除；乘除同级从左往右；加减同级从左往右。"], ["手算演示", "48÷6×2+3²−5：先得3²=9；再得48÷6×2=16；最后16+9−5=20。"], ["容易错在哪里", "不要误以为“先乘后除”。乘法和除法是同级，按从左往右计算。"], ["迁移验证", "把原题改成 48÷(6×2)+3²−5，观察括号如何改变结果。"]], "frac": [["什么是分数", "3/4不是两个互不相干的数，它表示把一个整体平均分成4份，取其中3份。"], ["和除法连接", "3/4=3÷4=0.75。百分数0.75=75%。"], ["理解比例", "3台机器4小时做120件，先求单台每小时的单位产量。"], ["完整计算", "120÷3÷4=10件/台/小时；5台6小时做5×6×10=300件。"], ["检查答案", "机器与时间都增加，产量应该超过120件。用数量变化方向检查结果。"]], "algebra": [["字母代表什么", "x表示一个暂时不知道或可以变化的数。字母不是装饰，是帮助描述规律。"], ["等式像天平", "x+7=15，左右两边的数值始终相等。"], ["为什么两边同时减7", "如果天平两侧同时移去相同重量，平衡仍保持。"], ["分步解题", "x+7−7=15−7，所以x=8。"], ["代回检验", "8+7=15。解题结束后应把答案代回原式。"]], "seq": [["观察变化", "数列3、7、11、15中，相邻两项总增加4。"], ["建立公式", "第n项是第一项加上(n−1)个公差：aₙ=3+(n−1)×4。"], ["逐步推算", "第10项：n−1=9，9×4=36，3+36=39。"], ["为什么减1", "第1项到第10项只有9次“向下一项”的变化。"], ["自己改题", "如果公差变成−2，第10项会是多少？"]], "prob": [["先明确样本空间", "概率是满足条件的结果数占所有等可能结果数的比例。"], ["具体示例", "袋中3红2蓝，共5球，每球被抽到的机会相同。"], ["列出有利情况", "红球有3个，因此P(红)=3/5。"], ["检查条件", "如果每个球被抽中的机会不同，不能直接用数量相除。"], ["反向提问", "想让红球概率变成1/2，应增加或减少多少球？"]]};
const STEPS={linear:[['从生活开始','一杯水2元，杯子押金1元。买x杯需要y=2x+1元。x是可以变化的数量，y跟着变化。'],['拆开公式','y=ax+b：a表示每增加1个x，y改变多少；b表示x=0时y是多少。'],['亲手验证','进入动态图实验，拖动a、b，看直线如何旋转和平移。不要先背结论。'],['换条件思考','如果每杯从2元变成3元，改变的是a；如果押金从1元变成5元，改变的是b。'],['验证理解','到分层练习里做一次函数题。做错时回到代数式、坐标系、比例关系。']],quad:[['从平方开始','正方形边长x，面积x²；当x变化时，面积不是匀速变化。'],['认识抛物线','y=ax²+bx+c 的图像通常是抛物线，a不为0。'],['亲手实验','在动态图实验中选择二次函数，改变a、b、c，观察开口方向、宽窄和顶点。'],['用配方法理解','y=(x−2)²+1 的平方项最小为0，因此最低点是(2,1)。'],['测试迁移','改变顶点位置、符号、系数，再判断最值和对称轴。']]};function lesson(){let n=node(activeNode),steps=STEPS[activeNode]||EXTRA_STEPS[activeNode]||[['先理解问题',n.desc],['追溯前置知识',n.pre.length?'先复习：'+n.pre.map(x=>node(x).name).join('、'):'这是基础起点，先弄清每个符号代表什么。'],['用例子验证','尝试自己编一个生活中的数量关系，观察输入和输出。'],['联系后续知识','后续可连接：'+N.filter(x=>x.pre.includes(n.id)).map(x=>x.name).join('、')],['练习与纠错','通过相关测试验证理解，不会的地方返回前置节点。']];lessonIndex=Math.min(lessonIndex,steps.length-1);$('#app').innerHTML=`<section class="panel"><div class="header"><h2>理解式教学 · ${n.name}</h2><button id="pick">从知识地图选择其他知识</button></div><p class="muted">不直接塞公式：先解释问题，再操作、推导、变式、验证。</p><div class="progress"><i style="width:${(lessonIndex+1)/steps.length*100}%"></i></div><div class="lesson-step"><span class="pill">第 ${lessonIndex+1} / ${steps.length} 步</span><h2 style="margin-top:13px">${steps[lessonIndex][0]}</h2><p>${steps[lessonIndex][1]}</p></div><div class="actions"><button id="before" ${lessonIndex===0?'disabled':''}>上一步</button><button class="primary" id="after">${lessonIndex===steps.length-1?'完成本节并练习':'下一步 →'}</button><button id="labBtn">打开可操作动态图</button></div></section><section class="panel"><h3>知识连接</h3><p>前置：${n.pre.map(x=>node(x).name).join('、')||'基础起点'}</p><p>后续：${N.filter(x=>x.pre.includes(n.id)).map(x=>x.name).join('、')||'综合应用'}</p><p class="muted small">目前一次函数、二次函数、运算、分数比例、代数方程、数列、概率有专门分步讲解；其余知识点详细内容仍待逐章扩充。</p></section>`;$('#pick').onclick=()=>go('map');$('#before').onclick=()=>{lessonIndex--;lesson()};$('#after').onclick=()=>{if(lessonIndex===steps.length-1){startQuiz('practice',Q.filter(q=>q.n function lab(){let controls=graphType==='linear'?['a','b']:graphType==='quad'?['a','b','c']:['a','b'];$('#app').innerHTML=`<section class="panel"><h2>数学动态图实验室 · 真的可以操作</h2><p>用滑块改变参数，图像实时重绘；也可以在图上拖动红色点，观察坐标变化。图形不是静态图片。</p><div class="actions"><button class="${graphType==='linear'?'primary':''}" data-type="linear">一次函数</button><button class="${graphType==='quad'?'primary':''}" data-type="quad">二次函数</button><button class="${graphType==='sine'?'primary':''}" data-type="sine">正弦函数</button></div><div class="two" style="margin-top:14px"><div><canvas id="plot" class="math-canvas" width="700" height="460" aria-label="动态函数坐标图"></canvas><p class="muted mini" id="pointText"></p></div><div><div class="formula" id="formula"></div><div id="sliders"></div><div class="notice" id="insight"></div><div class="actions"><button id="zero">重置参数</button><button id="learn">查看分步原理</button></div></div></div></section>`;$$('[data-type]').forEach(b=>b.onclick=()=>{graphType=b.dataset.type;A=graphType==='quad'?1:graphType==='sine'?1:2;B=graphType==='sine'?1:1;C=0;lab()});$('#sliders').innerHTML=controls.map(k=>`<label style="display:block;margin-top:18px"><b>${k} = <span id="v${k}">${({a:A,b:B,c:C})[k]}</span></b><input class="range" type="range" id="r${k}" min="-4" max="4" step="0.25" value="${({a:A,b:B,c:C})[k]}"></label>`).join('');controls.forEach(k=>$('#r'+k).oninput=e=>{if(k==='a')A=Number(e.target.value);if(k==='b')B=Number(e.target.value);if(k==='c')C=Number(e.target.value);$('#v'+k).textContent=e.target.value;draw()});$('#zero').onclick=()=>{A=graphType==='quad'?1:graphType==='sine'?1:2;B=1;C=0;lab()};$('#learn').onclick=()=>{activeNode=graphType==='quad'?'quad':graphType==='sine'?'trig':'linear';lessonIndex=0;go('lesson')};let cv=$('#plot'),drag=false;cv.onpointerdown=e=>{drag=true;cv.setPointerCapture(e.pointerId);move(e)};cv.onpointermove=e=>{if(drag)move(e)};cv.onpointerup=()=>drag=false;function move(e){let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*700;let val=Math.round(((x-350)/40)*4)/4;pointX=Math.min(8,Math.max(-8,val));draw()}draw()}
let pointX=1;function draw(){let cv=$('#plot');if(!cv)return;let ctx=cv.getContext('2d'),w=700,h=460,s=40,ox=350,oy=230;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.lineWidth=1;ctx.font='12px system-ui';for(let x=-8;x<=8;x++){ctx.strokeStyle='#edf1f6';ctx.beginPath();ctx.moveTo(ox+x*s,0);ctx.lineTo(ox+x*s,h);ctx.stroke();if(x!==0){ctx.fillStyle='#7b879b';ctx.fillText(x,ox+x*s-5,oy+17)}}for(let y=-5;y<=5;y++){ctx.strokeStyle='#edf1f6';ctx.beginPath();ctx.moveTo(0,oy-y*s);ctx.lineTo(w,oy-y*s);ctx.stroke();if(y!==0){ctx.fillStyle='#7b879b';ctx.fillText(y,ox+7,oy-y*s+4)}}ctx.strokeStyle='#64748b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(w,oy);ctx.moveTo(ox,0);ctx.lineTo(ox,h);ctx.stroke();let fn=x=>graphType==='linear'?A*x+B:graphType==='quad'?A*x*x+B*x+C:A*Math.sin(B*x);ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.beginPath();let started=false;for(let px=0;px<w;px++){let x=(px-ox)/s,y=fn(x),py=oy-y*s;if(py< -1000||py>h+1000){started=false;continue}if(!started){ctx.moveTo(px,py);started=true}else ctx.lineTo(px,py)}ctx.stroke();let y=fn(pointX),px=ox+pointX*s,py=oy-y*s;if(py>=0&&py<=h){ctx.fillStyle='#e11d48';ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill()}$('#pointText').textContent=`红点：x = ${pointX.toFixed(2)}，y = ${y.toFixed(2)}。按住图像左右拖动，观察对应值。`;$('#formula').textContent=graphType==='linear'?`y = ${A}x ${B<0?'− '+Math.abs(B):'+ '+B}`:graphType==='quad'?`y = ${A}x² ${B<0?'− '+Math.abs(B):'+ '+B}x ${C<0?'− '+Math.abs(C):'+ '+C}`:`y = ${A} sin(${B}x)`;$('#insight').textContent=graphType==='linear'?`观察：a=${A}，${A>0?'直线向右上升':A<0?'直线向右下降':'直线水平'}；b=${B}，图像与y轴交于(0,${B})。`:graphType==='quad'?`观察：a=${A}，${A>0?'开口向上':A<0?'开口向下':'a=0时不再是二次函数'}；改变b、c继续观察顶点和截距。`:`观察：a控制振幅大小，b控制变化频率。b=0时图像恒为0。角度采用弧度。`}
